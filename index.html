<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1622" />
    <!-- PWA：添加到主屏幕后以 standalone 全屏运行（无浏览器 UI，横屏锁定） -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="知识割草王" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon.svg" />
    <title>知识割草王</title>
    <style>
      /* 零外部素材约束：不引入任何字体文件，使用系统字体栈并带中文 fallback */
      :root {
        --font-stack: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei',
          'Source Han Sans CN', 'Noto Sans CJK SC', 'WenQuanYi Micro Hei',
          system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b1622;
        font-family: var(--font-stack);
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
        touch-action: none;
      }
      #game-root {
        /* 极限占满：即使父容器有 padding/margin 或不是 0 起点，
           也强制覆盖整个可视区域（覆盖父页面 header/footer/侧栏） */
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1;
      }
      /* 背景 canvas：铺满 #game-root（即整个视口），用 DPR 处理高清晰度 */
      #bg-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        display: block;
      }
      /* Phaser canvas（脚本自动创建）：在 #game-root 内 flex 居中，叠在背景之上。
         【锁定 2026-09-02】画布为方案 C（Scale.RESIZE）：canvas 的 width/height/margin
         全部由 Phaser 运行时按视口写入 inline style（如小米设备 2340×1080），
         此处与任何脚本都不得再注入尺寸样式覆盖它（回归门禁：verify-canvas-lock.mjs）。 */
      #game-root canvas:not(#bg-canvas) {
        position: relative;
        z-index: 1;
        display: block;
      }
      canvas {
        display: block;
      }
      /* 配置校验失败时的阻断提示层：不允许脏配置进入游戏 */
      #fatal-error {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 32px;
        background: #1a0f14;
        color: #ffd7de;
        font-family: var(--font-stack);
        text-align: left;
      }
      #fatal-error h1 {
        font-size: 22px;
        color: #ff6b81;
        margin-bottom: 16px;
      }
      #fatal-error pre {
        max-width: 720px;
        white-space: pre-wrap;
        line-height: 1.7;
        font-size: 14px;
        color: #ffd7de;
        background: rgba(255, 107, 129, 0.08);
        border-left: 4px solid #ff6b81;
        padding: 16px;
        border-radius: 4px;
      }
      /* ── 移动端横屏适配：竖屏 + 触屏设备时全屏提示旋转，横屏自动消失 ── */
      #rotate-overlay {
        position: fixed;
        inset: 0;
        z-index: 9998;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #0b1622;
        color: #ffffff;
        font-family: var(--font-stack);
        text-align: center;
        padding: 32px;
      }
      /* 只在「竖屏 + 触屏主设备」时出现：桌面浏览器竖窗口不会被遮挡 */
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate-overlay {
          display: flex;
        }
      }
      .rotate-phone {
        position: relative;
        width: 76px;
        height: 114px;
        border: 4px solid #7ec8ff;
        border-radius: 18px;
        background: rgba(126, 200, 255, 0.08);
        animation: kb-rotate-hint 1.6s ease-in-out infinite;
      }
      /* 手机屏幕内的迷你游戏画面示意 */
      .rotate-phone::after {
        content: '';
        position: absolute;
        left: 50%;
        top: 50%;
        width: 46px;
        height: 26px;
        transform: translate(-50%, -50%);
        border: 3px solid #ffd166;
        border-radius: 6px;
        background: rgba(255, 209, 102, 0.12);
      }
      @keyframes kb-rotate-hint {
        0%,
        15% {
          transform: rotate(0deg);
        }
        50%,
        70% {
          transform: rotate(90deg);
        }
        100% {
          transform: rotate(90deg);
        }
      }
      .rotate-title {
        font-size: 26px;
        font-weight: 700;
        color: #7ec8ff;
      }
      .rotate-sub {
        font-size: 15px;
        color: rgba(255, 255, 255, 0.62);
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div id="game-root">
      <!-- 背景 canvas：物理尺寸 = viewport × DPR，画草地场景延伸；
           让 Phaser canvas 之外的所有视口区域都有内容（解决黑边 / "未铺满" 问题）。
           Phaser canvas（脚本创建）会作为 #game-root 的另一子元素，z-index:1 叠在其上。 -->
      <canvas id="bg-canvas"></canvas>
    </div>
    <div id="rotate-overlay">
      <div class="rotate-phone"></div>
      <div class="rotate-title">请横屏游玩</div>
      <div class="rotate-sub">旋转手机以获得最佳体验</div>
    </div>
    <div id="fatal-error">
      <h1>配置校验失败，游戏已阻断启动</h1>
      <pre id="fatal-error-msg"></pre>
    </div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      // === 背景 canvas 同步 ===
      // 单 canvas 下 Phaser FIT 无法同时满足「铺满 viewport + 不变形」，
      // 这里用一个独立的背景 canvas 画草地场景延伸，让 Phaser canvas 之外
      // 的所有视口区域都有内容（彻底消除黑边 / 「未铺满」感）。
      // 背景 canvas 与 Phaser canvas 各自独立，DPR 各自处理，互不干扰。
      var syncBgCanvas = function () {
        var bg = document.getElementById('bg-canvas');
        if (!bg || !bg.getContext) return;
        var dpr = window.devicePixelRatio || 1;
        var w = window.innerWidth;
        var h = window.innerHeight;
        bg.width = Math.round(w * dpr);
        bg.height = Math.round(h * dpr);
        bg.style.width = w + 'px';
        bg.style.height = h + 'px';
        var ctx = bg.getContext('2d');
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        // 深色基底（与 Phaser canvas backgroundColor 一致：#0b1622）
        ctx.fillStyle = '#0b1622';
        ctx.fillRect(0, 0, w, h);

        // 草地横纹（呼应 GrassCuttingScene 的草地条带，0.04 透明度不抢戏）
        ctx.fillStyle = 'rgba(126, 200, 255, 0.04)';
        for (var y = 0; y < h; y += 96) {
          ctx.fillRect(0, y, w, 48);
        }

        // 底部深色草地
        ctx.fillStyle = '#0a1118';
        ctx.fillRect(0, h - 100, w, 100);

        // 三角形草丛（呼应主菜单背景），用屏幕宽度均分
        ctx.fillStyle = 'rgba(78, 154, 200, 0.5)';
        for (var x = 0; x < w; x += 60) {
          var tx = x + 30;
          ctx.beginPath();
          ctx.moveTo(tx - 18, h - 100);
          ctx.lineTo(tx + 18, h - 100);
          ctx.lineTo(tx, h - 130);
          ctx.closePath();
          ctx.fill();
        }
      };
      syncBgCanvas();
      window.addEventListener('resize', syncBgCanvas);
      window.addEventListener('orientationchange', syncBgCanvas);

      // === 横屏适配的 JS 兜底 ===
      // 部分 WebView / 嵌入式浏览器对 (pointer: coarse) 判定不准，
      // 这里用 navigator.maxTouchPoints 补充检测，并在方向变化时同步遮罩。
      var syncRotateOverlay = function () {
        var el = document.getElementById('rotate-overlay');
        if (!el) return;
        var coarse = window.matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 0;
        var portrait = window.matchMedia('(orientation: portrait)').matches;
        el.style.display = coarse && portrait ? 'flex' : 'none';
      };
      syncRotateOverlay();
      window.addEventListener('resize', syncRotateOverlay);
      window.addEventListener('orientationchange', syncRotateOverlay);
    </script>
  </body>
</html>
